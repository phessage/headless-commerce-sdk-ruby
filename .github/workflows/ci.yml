name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    strategy: {matrix: {ruby: ['3.1','3.2','3.3','3.4']}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: '${{ matrix.ruby }}'}
      - run: ruby -c lib/phessage/headless_commerce/client.rb
      - run: ruby -Ilib test/client_test.rb
  rails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: '3.3', bundler-cache: true}
      - run: bundle exec ruby -Ilib test/rails_runtime_test.rb
  deployed-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deployed non-mutating bootstrap probe
        run: curl --fail --silent --show-error https://api.1ecomm.com/v1/headless/stores/01f5b02f-d7c0-42cd-b880-59f78ea70aa3/config >/dev/null
