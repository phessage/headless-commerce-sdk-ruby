name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    strategy: {matrix: {ruby: ['3.1','3.2','3.3','3.4']}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: '${{ matrix.ruby }}'}
      - run: ruby scripts/check_contract.rb
      - run: ruby -c lib/phessage/headless_commerce/client.rb
      - run: ruby -Ilib test/client_test.rb
  rails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: '3.3', bundler-cache: true}
      - run: bundle exec ruby -Ilib test/rails_runtime_test.rb
  deployed-journey:
    # GitHub withholds secrets from pull requests opened from forks, so the
    # deployed journey cannot allocate a fixture there. It is skipped for forks
    # by design and stays fail-closed for every trusted run, including main.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env: {HEADLESS_E2E_ALLOCATOR_TOKEN: '${{ secrets.HEADLESS_E2E_ALLOCATOR_TOKEN }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: '3.3'}
      - name: Allocate isolated deployed fixture
        run: bash .github/scripts/headless-fixture.sh allocate
      - name: Run deployed catalog-to-order journey
        run: ruby -Ilib test/live.rb
      - name: Release isolated deployed fixture
        if: always()
        run: bash .github/scripts/headless-fixture.sh release
