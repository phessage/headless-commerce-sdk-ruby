name: Release package
on:
  workflow_dispatch:
    inputs:
      version: {description: Exact gemspec version to release, required: true, type: string}
permissions: {contents: write, packages: write}
concurrency: {group: ruby-sdk-release, cancel-in-progress: false}
jobs:
  release:
    runs-on: ubuntu-latest
    environment: package-release
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: '3.3', bundler-cache: true}
      - name: Verify immutable release identity
        env: {RELEASE_VERSION: '${{ inputs.version }}'}
        run: |
          gem_version="$(ruby -e "puts Gem::Specification.load('headless-commerce.gemspec').version")"
          test "$RELEASE_VERSION" = "$gem_version"
          ! git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1
      - run: bundle exec ruby -Ilib test/client_test.rb
      - run: bundle exec ruby -Ilib test/rails_runtime_test.rb
      - run: bash scripts/package-smoke.sh
      - name: Build release package, dependency manifest and checksums
        run: |
          mkdir release
          gem build headless-commerce.gemspec --output release/phessage-headless-commerce.gem
          bundle list > release/bundled-dependencies.txt
          shasum -a 256 release/* > release/SHA256SUMS
      - name: Publish restricted GitHub Packages gem
        env: {PACKAGE_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          mkdir -p "$RUNNER_TEMP/gem-home/.gem"
          printf '%s\n' '---' ":github: Bearer $PACKAGE_TOKEN" > "$RUNNER_TEMP/gem-home/.gem/credentials"
          chmod 0600 "$RUNNER_TEMP/gem-home/.gem/credentials"
          HOME="$RUNNER_TEMP/gem-home" gem push --key github --host https://rubygems.pkg.github.com/phessage release/phessage-headless-commerce.gem
      - name: Create immutable tag and GitHub release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', RELEASE_VERSION: '${{ inputs.version }}'}
        run: |
          git tag "v$RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "v$RELEASE_VERSION"
          gh release create "v$RELEASE_VERSION" release/* --verify-tag --title "v$RELEASE_VERSION" --generate-notes
