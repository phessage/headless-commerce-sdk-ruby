openapi: 3.1.1
info:
  title: 1Ecomm Headless Commerce API
  version: 0.6.0-preview.1
  description: Preview contract. Deployment and production support require the release gates documented in ecommerce-docs.
servers:
  - url: https://api.1ecomm.com
paths:
  /v1/headless/stores/{storeId}/config:
    get:
      operationId: getHeadlessStoreBootstrap
      summary: Resolve public runtime configuration for a configured store ID
      security: []
      parameters:
        - {
            name: storeId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Public store runtime configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreBootstrapResponse' }
        '400':
          description: Invalid store ID
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: Store is not configured for headless access
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/carts:
    post:
      operationId: createCart
      summary: Create an isolated anonymous cart
      security: [{ headlessPublishableKey: [] }]
      responses:
        '201':
          description: New cart and its one-time returned capability token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateCartResponse' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/carts/current:
    get:
      operationId: getCart
      summary: Read the cart owned by the presented capability token
      security: [{ headlessPublishableKey: [], headlessCartToken: [] }]
      responses:
        '200':
          description: Token-owned cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: 'Cart token is missing, invalid, expired, or belongs to another store'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/carts/current/items:
    post:
      operationId: addCartItem
      summary: Add a sellable product to the token-owned cart
      security: [{ headlessPublishableKey: [], headlessCartToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartItemInput' }
      responses:
        '201':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '400':
          description: 'Invalid or unavailable product, variant, or quantity'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: 'Cart token is missing, invalid, expired, or belongs to another store'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/carts/current/items/{itemId}:
    parameters:
      - {
          name: itemId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      operationId: updateCartItem
      summary: Set a cart line quantity
      security: [{ headlessPublishableKey: [], headlessCartToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCartItemInput' }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '400':
          description: Invalid quantity or immutable promotional line
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: Cart or item not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
    delete:
      operationId: removeCartItem
      summary: Remove a standard cart line
      security: [{ headlessPublishableKey: [], headlessCartToken: [] }]
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '400':
          description: Immutable promotional line
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: Cart or item not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/carts/current/checkout:
    get:
      operationId: getCheckoutPreparation
      summary: Read checkout preparation state and server-authoritative choices
      security: [{ headlessPublishableKey: [], headlessCartToken: [] }]
      responses:
        '200':
          description: Checkout preparation state
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/CheckoutPreparationResponse' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: 'Cart token is missing, invalid, expired, or cross-store'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
    patch:
      operationId: updateCheckoutDetails
      summary: Update guest contact and addresses
      security: [{ headlessPublishableKey: [], headlessCartToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutDetailsInput' }
      responses:
        '200':
          description: Updated checkout preparation state
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/CheckoutPreparationResponse' }
        '400':
          description: Invalid or unknown input field
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: 'Cart token is missing, invalid, expired, or cross-store'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/carts/current/checkout/shipping-method:
    put:
      operationId: selectCheckoutShippingMethod
      summary: Select an option from the server-quoted shipping set
      security: [{ headlessPublishableKey: [], headlessCartToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutSelectionInput' }
      responses:
        '200':
          description: Updated checkout preparation state
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/CheckoutPreparationResponse' }
        '400':
          description: 'Option is unavailable, ineligible, invalid, or expired'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: 'Cart token is missing, invalid, expired, or cross-store'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/carts/current/checkout/payment-method:
    put:
      operationId: selectCheckoutPaymentMethod
      summary: Select a checkout-ready payment method
      security: [{ headlessPublishableKey: [], headlessCartToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutSelectionInput' }
      responses:
        '200':
          description: Updated checkout preparation state
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/CheckoutPreparationResponse' }
        '400':
          description: Payment method is unavailable or not checkout-ready
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: 'Cart token is missing, invalid, expired, or cross-store'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/carts/current/checkout/order:
    post:
      operationId: placeHeadlessOrder
      summary: Place one order using the selected non-hosted payment method
      security: [{ headlessPublishableKey: [], headlessCartToken: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Order confirmation; a guest checkout token is returned only once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceOrderResponse' }
        '400':
          description: Checkout is incomplete or the payment method requires hosted checkout
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: 'Cart token is missing, invalid, expired, or cross-store'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/carts/current/checkout/payment-session:
    post:
      operationId: createHeadlessHostedPaymentSession
      summary: Atomically create the pending order and idempotent hosted checkout session
      security: [{ headlessPublishableKey: [], headlessCartToken: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostedPaymentSessionInput' }
      responses:
        '201':
          description: Pending order and provider-hosted checkout handoff
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/HostedPaymentSessionResponse' }
        '400':
          description: Checkout is incomplete, payment method is not hosted, or redirect origin is not allow-listed
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: Cart or leased order not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/orders/lookup:
    post:
      operationId: lookupHeadlessOrder
      summary: Look up a guest order by order number and checkout email
      security: [{ headlessPublishableKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderLookupInput' }
      responses:
        '201':
          description: Current redacted order, item fulfillment, and tracking state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderLookupResponse' }
        '400':
          description: Invalid or unknown input field
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: Order not found or the checkout email does not match
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/auth/config:
    get:
      operationId: getHeadlessCustomerAuthConfig
      summary: Read enabled customer authentication methods
      security: [{ headlessPublishableKey: [] }]
      responses:
        '200':
          description: Store-scoped customer authentication configuration
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/CustomerAuthConfigResponse' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/auth/login:
    post:
      operationId: loginHeadlessCustomer
      summary: Sign in a customer with email and password
      security: [{ headlessPublishableKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerPasswordLoginInput' }
      responses:
        '200':
          description: Customer session and cart-merge state
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/CustomerAuthenticationResponse' }
        '401':
          description: Invalid application or customer credentials
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/auth/password/recovery:
    post:
      operationId: requestHeadlessCustomerPasswordRecovery
      summary: Request a non-enumerating customer password recovery email
      security: [{ headlessPublishableKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerPasswordRecoveryRequestInput' }
      responses:
        '202':
          description: Recovery request accepted regardless of account existence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPasswordRecoveryRequestResponse' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/auth/password/reset:
    post:
      operationId: completeHeadlessCustomerPasswordRecovery
      summary: Consume a password recovery capability and set a new password
      security: [{ headlessPublishableKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerPasswordRecoveryCompleteInput' }
      responses:
        '200':
          description: Password changed and recovery capability consumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPasswordRecoveryCompleteResponse' }
        '401':
          description: Invalid application or invalid, expired, consumed, or mismatched recovery capability
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/auth/otp/request:
    post:
      operationId: requestHeadlessCustomerOtp
      summary: Request a store-scoped email or SMS sign-in code
      security: [{ headlessPublishableKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerOtpRequestInput' }
      responses:
        '200':
          description: Non-enumerating OTP delivery result
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/CustomerOtpRequestResponse' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/auth/refresh:
    post:
      operationId: refreshHeadlessCustomerSession
      summary: Rotate a customer refresh capability and issue a new short-lived access token
      security: [{ headlessPublishableKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRefreshInput' }
      responses:
        '200':
          description: Rotated customer session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerSessionResponse' }
        '401':
          description: Invalid, expired, revoked, replayed, or cross-store refresh capability; replay of a consumed token revokes its refresh-token family
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/auth/logout:
    post:
      operationId: logoutHeadlessCustomerSession
      summary: Revoke a customer refresh capability
      security: [{ headlessPublishableKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRefreshInput' }
      responses:
        '200':
          description: Logout accepted without revealing capability state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerLogoutResponse' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/auth/otp/verify:
    post:
      operationId: verifyHeadlessCustomerOtp
      summary: Verify an OTP and create or resume a customer session
      security: [{ headlessPublishableKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerOtpVerifyInput' }
      responses:
        '200':
          description: Customer session and cart-merge state
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/CustomerAuthenticationResponse' }
        '401':
          description: Invalid application or OTP
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/auth/social/{provider}:
    parameters:
      - {
          name: provider,
          in: path,
          required: true,
          schema: { enum: [google, apple] },
        }
    post:
      operationId: authenticateHeadlessCustomerSocial
      summary: Exchange a verified-provider ID token for a customer session
      security: [{ headlessPublishableKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerSocialLoginInput' }
      responses:
        '200':
          description: Customer session and cart-merge state
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/CustomerAuthenticationResponse' }
        '401':
          description: Invalid application or provider identity
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: Unsupported provider
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/auth/oauth/{provider}/authorize:
    parameters:
      - { name: provider, in: path, required: true, schema: { enum: [google, apple] } }
    post:
      operationId: authorizeHeadlessCustomerOAuth
      summary: Begin browser or mobile customer authorization with PKCE
      security: [{ headlessPublishableKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerOAuthAuthorizeInput' }
      responses:
        '200':
          description: Provider authorization URL backed by single-use state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerOAuthAuthorizationResponse' }
        '400':
          description: Provider unavailable or callback URI not registered
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/auth/oauth/token:
    post:
      operationId: exchangeHeadlessCustomerOAuthCode
      summary: Exchange a one-time authorization code using its PKCE verifier
      security: [{ headlessPublishableKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerOAuthTokenInput' }
      responses:
        '200':
          description: Customer session and cart-merge state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAuthenticationResponse' }
        '401':
          description: Invalid, expired, replayed, or incorrectly bound code
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/me:
    get:
      operationId: getHeadlessCustomerProfile
      summary: Read the authenticated customer's store-scoped profile
      security: [{ headlessPublishableKey: [], headlessCustomerToken: [] }]
      responses:
        '200':
          description: Redacted customer profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerProfileResponse' }
        '401':
          description: 'Missing, invalid, inactive, or cross-store customer session'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
    patch:
      operationId: updateHeadlessCustomerProfile
      summary: Update the authenticated customer's editable profile fields
      security: [{ headlessPublishableKey: [], headlessCustomerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerProfileUpdateInput' }
      responses:
        '200':
          description: Updated redacted profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerProfileResponse' }
        '401':
          description: Customer authentication required
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/cart/merge:
    post:
      operationId: mergeHeadlessCustomerCart
      summary: Merge the token-owned anonymous cart into the signed-in customer's cart
      security:
        [
          {
            headlessPublishableKey: [],
            headlessCustomerToken: [],
            headlessCartToken: [],
          },
        ]
      responses:
        '200':
          description: Cart merge outcome with a rotated capability for the customer-owned cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerCartMergeResponse' }
        '401':
          description: Customer authentication required
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: Cart not found in the key-bound store
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/addresses:
    get:
      operationId: listHeadlessCustomerAddresses
      summary: List the customer's saved addresses
      security: [{ headlessPublishableKey: [], headlessCustomerToken: [] }]
      responses:
        '200':
          description: 'Saved addresses, default first'
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/CustomerAddressListResponse' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
    post:
      operationId: createHeadlessCustomerAddress
      summary: Create a saved address
      security: [{ headlessPublishableKey: [], headlessCustomerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerAddressInput' }
      responses:
        '200':
          description: Created address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAddressResponse' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/addresses/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      operationId: updateHeadlessCustomerAddress
      summary: Update an owned saved address
      security: [{ headlessPublishableKey: [], headlessCustomerToken: [] }]
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAddressResponse' }
        '404':
          description: Address not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
    delete:
      operationId: deleteHeadlessCustomerAddress
      summary: Delete an owned saved address
      security: [{ headlessPublishableKey: [], headlessCustomerToken: [] }]
      responses:
        '200':
          description: Address deleted
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/CustomerAddressDeleteResponse' }
        '404':
          description: Address not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/addresses/{id}/default:
    post:
      operationId: defaultHeadlessCustomerAddress
      summary: Make an owned saved address the default
      security: [{ headlessPublishableKey: [], headlessCustomerToken: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: New default address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAddressResponse' }
        '404':
          description: Address not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/orders:
    get:
      operationId: listHeadlessCustomerOrders
      summary: List the authenticated customer's order history
      security: [{ headlessPublishableKey: [], headlessCustomerToken: [] }]
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: Customer-owned order page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerOrderPageResponse' }
        '401':
          description: Customer authentication required
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/orders/{id}:
    get:
      operationId: getHeadlessCustomerOrder
      summary: Read one customer-owned order with tracking
      security: [{ headlessPublishableKey: [], headlessCustomerToken: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Redacted customer order and tracking
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/CustomerOrderDetailResponse' }
        '404':
          description: Order not found or belongs to another customer
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/orders/{id}/cancel:
    post:
      operationId: cancelHeadlessCustomerOrder
      summary: Request cancellation of an eligible customer-owned order
      security: [{ headlessPublishableKey: [], headlessCustomerToken: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelOrderInput' }
      responses:
        '200':
          description: Cancellation outcome
          content:
            application/json:
              schema:
                {
                  $ref: '#/components/schemas/CustomerOrderCancellationResponse',
                }
        '404':
          description: Order not found or belongs to another customer
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/returns:
    get:
      operationId: listHeadlessCustomerReturns
      summary: List the authenticated customer's return requests
      security: [{ headlessPublishableKey: [], headlessCustomerToken: [] }]
      responses:
        '200':
          description: Customer-owned return requests
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/CustomerReturnListResponse' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/orders/{orderId}/returns:
    parameters:
      - {
          name: orderId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: listHeadlessOrderReturns
      summary: List return requests for one customer-owned order
      security: [{ headlessPublishableKey: [], headlessCustomerToken: [] }]
      responses:
        '200':
          description: Return requests for the order
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/CustomerReturnListResponse' }
        '404':
          description: Order not found or belongs to another customer
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
    post:
      operationId: createHeadlessOrderReturn
      summary: Open a return request for eligible fulfilled lines
      security: [{ headlessPublishableKey: [], headlessCustomerToken: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReturnInput' }
      responses:
        '201':
          description: Created return request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerReturnResponse' }
        '400':
          description: Return is ineligible or input is invalid
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: Order not found or belongs to another customer
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '409':
          description: Idempotency key was already used with a different return request
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/customer/returns/{id}/cancel:
    post:
      operationId: cancelHeadlessCustomerReturn
      summary: Cancel a still-requested customer-owned return
      security: [{ headlessPublishableKey: [], headlessCustomerToken: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Cancelled return request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerReturnResponse' }
        '404':
          description: Return request not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/products:
    get:
      operationId: listProducts
      summary: List published products in the store bound to a publishable key
      security: [{ headlessPublishableKey: [] }]
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: query, in: query, schema: { type: string } }
      responses:
        '200':
          description: Published product page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/products/categories:
    get:
      operationId: listCategories
      summary: List the public category tree
      security: [{ headlessPublishableKey: [] }]
      responses:
        '200':
          description: Public category tree
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryTreeResponse' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
  /v1/headless/products/{id}:
    get:
      operationId: getProduct
      summary: Get one published product
      security: [{ headlessPublishableKey: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Published product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '401':
          description: Missing or invalid publishable key
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        '404':
          description: Product does not exist in the key-bound store or is not published
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
        default:
          description: Unexpected or unlisted headless failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/HeadlessProblem' }
components:
  securitySchemes:
    headlessPublishableKey:
      { type: apiKey, in: header, name: x-publishable-key }
    headlessCartToken: { type: apiKey, in: header, name: x-cart-token }
    headlessCustomerToken: { type: apiKey, in: header, name: x-customer-token }
  schemas:
    HeadlessProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, requestId, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        errors:
          type: array
          items: { type: string }
        fields:
          type: object
          additionalProperties: true
    CustomerPasswordLoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
    CustomerPasswordRecoveryRequestInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    CustomerPasswordRecoveryCompleteInput:
      type: object
      additionalProperties: false
      required: [email, token, newPassword]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        token: { type: string, pattern: '^[a-f0-9]{64}$' }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    CustomerPasswordRecoveryRequestResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [accepted]
          properties:
            accepted: { const: true }
        requestId: { type: string, format: uuid }
    CustomerPasswordRecoveryCompleteResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [reset]
          properties:
            reset: { const: true }
        requestId: { type: string, format: uuid }
    CustomerOtpRequestInput:
      type: object
      additionalProperties: false
      required: [channel, destination]
      properties:
        channel: { enum: [email, sms] }
        destination: { type: string, maxLength: 254 }
        region: { type: string, pattern: '^[A-Za-z]{2}$' }
    CustomerOtpVerifyInput:
      allOf:
        - { $ref: '#/components/schemas/CustomerOtpRequestInput' }
        - type: object
          additionalProperties: false
          required: [code]
          properties:
            code: { type: string, minLength: 4, maxLength: 8 }
            firstName: { type: string, maxLength: 80 }
            lastName: { type: string, maxLength: 80 }
    CustomerSocialLoginInput:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken: { type: string, maxLength: 8192 }
        firstName: { type: string, maxLength: 80 }
        lastName: { type: string, maxLength: 80 }
    CustomerOAuthAuthorizeInput:
      type: object
      additionalProperties: false
      required: [redirectUri, codeChallenge, state]
      properties:
        redirectUri: { type: string, minLength: 8, maxLength: 2048 }
        codeChallenge: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        state: { type: string, minLength: 16, maxLength: 1024 }
    CustomerOAuthTokenInput:
      type: object
      additionalProperties: false
      required: [code, codeVerifier, redirectUri]
      properties:
        code: { type: string, pattern: '^[a-f0-9]{64}$' }
        codeVerifier: { type: string, pattern: '^[A-Za-z0-9._~-]{43,128}$' }
        redirectUri: { type: string, minLength: 8, maxLength: 2048 }
    CustomerOAuthAuthorizationResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [authorizationUrl, expiresIn]
          properties:
            authorizationUrl: { type: string, format: uri }
            expiresIn: { type: integer, enum: [600] }
        requestId: { type: string, format: uuid }
    CustomerRefreshInput:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, pattern: '^[a-f0-9]{64}$' }
    CustomerSession:
      type: object
      additionalProperties: false
      required: [token, refreshToken, expiresIn]
      properties:
        token: { type: string }
        refreshToken: { type: string, pattern: '^[a-f0-9]{64}$' }
        expiresIn:
          {
            type: integer,
            enum: [900],
            description: Access-token lifetime in seconds,
          }
    CustomerAuthentication:
      type: object
      additionalProperties: false
      required: [token, refreshToken, expiresIn, customer, cartInfo]
      properties:
        token: { type: string }
        refreshToken: { type: string, pattern: '^[a-f0-9]{64}$' }
        expiresIn: { type: integer, enum: [900] }
        customer: { $ref: '#/components/schemas/CustomerProfile' }
        cartInfo: { $ref: '#/components/schemas/CustomerCartInfo' }
    CustomerProfile:
      type: object
      additionalProperties: false
      required:
        [id, email, firstName, lastName, phone, avatarUrl, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, 'null'], format: email }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        emailVerified: { type: boolean }
    CustomerCartInfo:
      type: object
      additionalProperties: false
      required:
        [
          hasAnonymousCart,
          hasCustomerCart,
          anonymousCartItemCount,
          customerCartItemCount,
          requiresMergeDecision,
        ]
      properties:
        hasAnonymousCart: { type: boolean }
        hasCustomerCart: { type: boolean }
        anonymousCartItemCount: { type: integer, minimum: 0 }
        customerCartItemCount: { type: integer, minimum: 0 }
        requiresMergeDecision: { type: boolean }
    CustomerProfileResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/CustomerProfile' }
        requestId: { type: string, format: uuid }
    CustomerSessionResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/CustomerSession' }
        requestId: { type: string, format: uuid }
    CustomerAuthenticationResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/CustomerAuthentication' }
        requestId: { type: string, format: uuid }
    CustomerCartMergeResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [merged, cartId, cartToken]
          properties:
            merged: { type: boolean }
            cartId: { type: [string, 'null'], format: uuid }
            cartToken:
              {
                type: [string, 'null'],
                description: Rotated capability for subsequent customer-owned cart and checkout calls,
              }
        requestId: { type: string, format: uuid }
    CustomerProfileUpdateInput:
      type: object
      additionalProperties: false
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 30 }
    CustomerAddressInput:
      type: object
      additionalProperties: false
      required: [firstName, lastName, address1, city, province, country, zip]
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        company: { type: string, maxLength: 150 }
        address1: { type: string, maxLength: 200 }
        address2: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        province: { type: string, maxLength: 100 }
        country: { type: string, minLength: 2, maxLength: 2 }
        zip: { type: string, maxLength: 30 }
        phone: { type: string, maxLength: 40 }
        setDefault: { type: boolean }
    CustomerAddress:
      type: object
      additionalProperties: false
      required:
        [
          id,
          firstName,
          lastName,
          company,
          address1,
          address2,
          city,
          province,
          country,
          zip,
          phone,
          isDefault,
        ]
      properties:
        id: { type: [string, 'null'], format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        company: { type: [string, 'null'] }
        address1: { type: string }
        address2: { type: [string, 'null'] }
        city: { type: string }
        province: { type: string }
        country: { type: string }
        zip: { type: string }
        phone: { type: [string, 'null'] }
        isDefault: { type: boolean }
    CustomerAddressResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [address]
          properties:
            address: { $ref: '#/components/schemas/CustomerAddress' }
        requestId: { type: string, format: uuid }
    CustomerAddressListResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [addresses]
          properties:
            addresses:
              type: array
              items: { $ref: '#/components/schemas/CustomerAddress' }
        requestId: { type: string, format: uuid }
    CustomerAuthConfig:
      type: object
      additionalProperties: false
      required: [password, emailOtp, smsOtp, google, apple]
      properties:
        password: { type: boolean }
        emailOtp: { type: boolean }
        smsOtp: { type: boolean }
        google: { $ref: '#/components/schemas/CustomerSocialProviderConfig' }
        apple: { $ref: '#/components/schemas/CustomerSocialProviderConfig' }
    CustomerSocialProviderConfig:
      type: object
      additionalProperties: false
      required: [enabled, clientId]
      properties:
        enabled: { type: boolean }
        clientId: { type: [string, 'null'] }
    CustomerAuthConfigResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/CustomerAuthConfig' }
        requestId: { type: string, format: uuid }
    CustomerOtpRequestResult:
      type: object
      additionalProperties: false
      required: [success, status]
      properties:
        success: { type: boolean }
        status:
          enum:
            [sent, unavailable, invalid_destination, rate_limited, send_failed]
        retryAfterSeconds: { type: integer, minimum: 1 }
    CustomerOtpRequestResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/CustomerOtpRequestResult' }
        requestId: { type: string, format: uuid }
    CustomerLogoutResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [loggedOut]
          properties:
            loggedOut: { const: true }
        requestId: { type: string, format: uuid }
    CustomerAddressDeleteResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
